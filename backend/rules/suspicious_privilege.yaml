id: DET-WIN-002
name: Suspicious Privilege Activity
description: Special privileges assigned to new logon (4672) for non-standard accounts.
platform: windows
enabled: true
severity: high
confidence: 0.7
type: single_event
mitre_attack:
  - T1078
recommendations:
  - Confirm the account is authorized for admin logon on this host.
  - Review preceding 4624 logon events.
false_positive_notes:
  - Expected admin interactive logons on domain controllers.
match:
  all:
    - field: event_id
      op: eq
      value: "4672"
