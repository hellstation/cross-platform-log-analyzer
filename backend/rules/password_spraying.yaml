id: DET-LNX-002
name: Password Spraying
description: Failed logins against multiple distinct usernames from one source IP.
platform: linux
enabled: true
severity: high
confidence: 0.8
type: aggregation
mitre_attack:
  - T1110.003
recommendations:
  - Identify valid accounts targeted and enforce MFA where possible.
  - Correlate with VPN or proxy logs for the same IP.
false_positive_notes:
  - Shared NAT egress with multiple users mistyping passwords.
aggregation:
  group_by:
    - source_ip
  window_minutes: 30
  threshold: 8
  event_filter:
    all:
      - field: event_type
        op: in
        value:
          - ssh_login_failure
          - ssh_invalid_user
