services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentineltrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-sentineltrace}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentineltrace}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sentineltrace

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentineltrace}:${POSTGRES_PASSWORD:-changeme_local_only}@db:5432/${POSTGRES_DB:-sentineltrace}
      RULES_PATH: /app/rules
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./backend/rules:/app/rules:ro
      - uploads:/app/uploads
      - ./fixtures:/app/fixtures:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sentineltrace

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sentineltrace

volumes:
  pgdata:
  uploads:

networks:
  sentineltrace:
